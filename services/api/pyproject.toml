[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurolab-api"
version = "1.0.0"
description = "Enterprise Neural Network Platform API"
authors = [{ name = "NeuroLab Enterprise Team" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "redis>=5.0.2"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Reglas de errores reales (sintaxis, nombres indefinidos, imports rotos).
# Se puede ampliar progresivamente sin bloquear el CI por estilo histórico.
select = ["E9", "F63", "F7", "F82", "F811"]
